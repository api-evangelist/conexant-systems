name: Conexant Systems
description: 'Conexant Systems, Inc. was an American fabless semiconductor company headquartered
  in Irvine, California. Spun off from Rockwell Semiconductor Systems in 1999, it designed
  mixed-signal and system-on-chip products for audio, voice, imaging, modem, and networking
  applications, and was best known for its dial-up modem chipsets, audio codecs, and far-field
  voice-input processors used in smart-home and IoT devices. Conexant''s audio and imaging
  business was acquired by Synaptics in 2017 and the standalone Conexant brand has since been
  retired. This profile was added to the API Evangelist network as a portfolio-company lead;
  the company publishes no public developer portal, API, or machine-readable API surface (its
  former conexant.com domain no longer resolves to an active site), so there are no API artifacts
  to enrich at this time.'
